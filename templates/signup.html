<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — Create Account</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='signup.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <!-- Animated orbs (same vibe as login) -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">
      <div class="auth-card">
        <!-- Brand -->
        <div class="brand">
          <div class="brand-icon">⚡</div>
          <span class="brand-name">YourApp</span>
        </div>

        <h1>Create Account 🚀</h1>
        <p class="subtitle">Join thousands of users today — it's free</p>

        <!-- Social signup -->
        <div class="social-row">
          <button class="social-btn" type="button">
            <i class="fa-brands fa-google"></i> Google
          </button>
          <button class="social-btn" type="button">
            <i class="fa-brands fa-github"></i> GitHub
          </button>
        </div>

        <div class="divider"><span>or sign up with email</span></div>

        <!-- Signup Form -->
        <form method="POST" id="signupForm" novalidate>
          <!-- Full name -->
          <div class="input-group">
            <label for="fullname">Full Name</label>
            <div class="input-wrap">
              <i class="fa-solid fa-user"></i>
              <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="John Doe"
                required
                autocomplete="name"
              />
            </div>
            <span class="field-hint" id="nameHint"></span>
          </div>

          <!-- Email -->
          <div class="input-group">
            <label for="email">Email Address</label>
            <div class="input-wrap">
              <i class="fa-solid fa-envelope"></i>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
                autocomplete="email"
              />
            </div>
            <span class="field-hint" id="emailHint"></span>
          </div>

          <!-- Password -->
          <div class="input-group">
            <label for="password">Password</label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock"></i>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a strong password"
                required
                autocomplete="new-password"
              />
              <button type="button" class="eye-btn" id="eyeBtn1">
                <i class="fa-solid fa-eye" id="eyeIcon1"></i>
              </button>
            </div>
            <!-- Password strength bar -->
            <div class="strength-bar-track">
              <div class="strength-bar" id="strengthBar"></div>
            </div>
            <span class="strength-label" id="strengthLabel"></span>
          </div>

          <!-- Confirm password -->
          <div class="input-group">
            <label for="confirm">Confirm Password</label>
            <div class="input-wrap">
              <i class="fa-solid fa-shield-halved"></i>
              <input
                type="password"
                id="confirm"
                name="confirm"
                placeholder="Repeat your password"
                required
                autocomplete="new-password"
              />
              <button type="button" class="eye-btn" id="eyeBtn2">
                <i class="fa-solid fa-eye" id="eyeIcon2"></i>
              </button>
            </div>
            <span class="field-hint" id="confirmHint"></span>
          </div>

          <!-- Terms checkbox -->
          <label class="terms">
            <input type="checkbox" id="terms" name="terms" required />
            <span class="checkmark"></span>
            <span
              >I agree to the <a href="/terms">Terms of Service</a> and
              <a href="/privacy">Privacy Policy</a></span
            >
          </label>

          <!-- Submit -->
          <button type="submit" class="btn" id="signupBtn">
            <span id="btnText">Create Account</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <p class="switch-text">
          Already have an account? <a href="/login">Sign In</a>
        </p>
      </div>
    </div>

    <script>
      // ── Password visibility toggles ──
      function togglePw(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        const hide = input.type === "password";
        input.type = hide ? "text" : "password";
        icon.className = hide ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
      }
      document.getElementById("eyeBtn1").onclick = () =>
        togglePw("password", "eyeIcon1");
      document.getElementById("eyeBtn2").onclick = () =>
        togglePw("confirm", "eyeIcon2");

      // ── Password strength meter ──
      const pwInput = document.getElementById("password");
      const bar = document.getElementById("strengthBar");
      const label = document.getElementById("strengthLabel");

      const levels = [
        { min: 0, label: "", color: "transparent", w: "0%" },
        { min: 1, label: "Weak", color: "#ef4444", w: "25%" },
        { min: 3, label: "Fair", color: "#f97316", w: "50%" },
        { min: 5, label: "Good", color: "#eab308", w: "75%" },
        { min: 7, label: "Strong 💪", color: "#22c55e", w: "100%" },
      ];

      pwInput.addEventListener("input", () => {
        const pw = pwInput.value;
        let score = 0;
        if (pw.length >= 8) score++;
        if (pw.length >= 12) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[a-z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score += 2;

        const lvl = [...levels].reverse().find((l) => score >= l.min);
        bar.style.width = pw.length ? lvl.w : "0%";
        bar.style.background = lvl.color;
        label.textContent = pw.length ? lvl.label : "";
        label.style.color = lvl.color;
      });

      // ── Confirm password match hint ──
      const confirmInput = document.getElementById("confirm");
      const confirmHint = document.getElementById("confirmHint");

      confirmInput.addEventListener("input", () => {
        if (!confirmInput.value) {
          confirmHint.textContent = "";
          return;
        }
        const match = confirmInput.value === pwInput.value;
        confirmHint.textContent = match
          ? "✓ Passwords match"
          : "✗ Passwords don't match";
        confirmHint.style.color = match ? "#22c55e" : "#ef4444";
      });

      // ── Button loading state ──
      document.getElementById("signupForm").addEventListener("submit", (e) => {
        const terms = document.getElementById("terms");
        if (!terms.checked) {
          e.preventDefault();
          terms.closest("label").style.color = "#ef4444";
          return;
        }
        const btn = document.getElementById("signupBtn");
        const text = document.getElementById("btnText");
        btn.disabled = true;
        text.textContent = "Creating account…";
        btn.classList.add("loading");
      });
    </script>
  </body>
</html>
